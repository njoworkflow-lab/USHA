:root{--ink:#F3EEE8;--ink2:rgba(243,238,232,.84);--ink3:rgba(243,238,232,.6);--line:rgba(243,238,232,.16);--ember:#FF5A1F;--peach:#FFB48A;--lime:#D4FF3A;--dusk:rgba(28,26,34,.72);--g:clamp(20px,3.6vw,64px);--head:'Geist',system-ui,sans-serif;--body:'Golos Text','Geist',system-ui,sans-serif;--serif:'Literata',Georgia,serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#030304;color:var(--ink)}
html.locked,html.locked body,html.gaming,html.gaming body{overflow:hidden}
body{font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-weight:400}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit;background:none;border:0}button{cursor:pointer}
i{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.025em}
b{font-weight:600}
h1,h2,h3{font-family:var(--head)}
#gl{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;display:block;z-index:0;touch-action:pan-y}
.sp .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.sp .w>span{display:inline-block;transform:translate3d(0,calc(108% * (1 - min(1, max(0, var(--v,0) * 2.2 - var(--i,0) * .07)))),0);transform-origin:0 100%}
.kick{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--ink3)}
.kick::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember)}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:99px;font-weight:500;font-size:15px;transition:transform .5s var(--ease),background .3s,box-shadow .3s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn-p{background:var(--ink);color:#0b0a0f;box-shadow:0 0 50px -8px rgba(255,170,130,.45)}
.btn-p .d{width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember)}
.btn-g{box-shadow:inset 0 0 0 1px var(--line);background:rgba(10,9,12,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill{border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);background:rgba(10,9,12,.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.glass{border-radius:24px;background:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.025));backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),0 40px 80px -30px rgba(0,0,0,.8)}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;transition:opacity 1s var(--ease)}
#intro.gone{opacity:0;pointer-events:none}
.intro-wm{position:absolute;top:30px;left:50%;transform:translateX(-50%);height:22px}.intro-wm svg{height:100%;width:auto;display:block}
.hold{position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;transform:scale(calc(1 - var(--k,0)*.08))}
.hold .gl{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.14),rgba(255,255,255,.03));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.hold .core{position:relative;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 calc(14px + var(--k,0)*70px) calc(2px + var(--k,0)*20px) rgba(255,190,150,.9)}
#holdRing{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#holdRing circle{fill:none;stroke-width:1.5}
#holdRing .bg{stroke:rgba(255,255,255,.12)}
#holdRing .fg{stroke:var(--peach);stroke-dasharray:452;stroke-dashoffset:calc(452 - 452 * var(--p,0));stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,140,90,.8))}
.hold-t{position:absolute;bottom:11vh;left:var(--g);right:var(--g);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.hold-t h2{font-weight:300;font-size:clamp(22px,2.4vw,34px);letter-spacing:-.035em;line-height:1.1}
.hold-t p{font-size:15px;color:var(--ink3)}
.hold-hint{position:absolute;top:calc(50% + 92px);left:0;right:0;text-align:center;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
/* wake greeting */
#hey{position:fixed;inset:0;z-index:90;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh;text-align:center;opacity:0}
#hey h2{font-weight:300;font-size:clamp(54px,9vw,170px);line-height:.9;letter-spacing:-.065em}
#hey h2 b{font-weight:500}
#hey p{margin-top:22px;font-size:clamp(16px,1.4vw,20px);color:var(--ink2)}
/* ---------- header ---------- */
header{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:20px var(--g);gap:20px;transition:opacity .8s,transform .6s var(--ease)}
html.locked header,html.gaming header{opacity:0;pointer-events:none}
header.hide{transform:translateY(-110%)}
.logo{height:22px;display:block}.logo svg{height:100%;width:auto;display:block}
nav.mid{display:flex;gap:30px;font-size:14px;font-weight:500;color:var(--ink3)}
nav.mid a{transition:color .3s}nav.mid a:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:8px}
.lang{display:flex;padding:4px}
.lang button{font-size:11.5px;font-weight:600;letter-spacing:.06em;width:36px;height:28px;border-radius:99px;color:var(--ink3);transition:all .35s}
.lang button.on{background:var(--ink);color:#0b0a0f}
#snd{width:36px;height:36px;display:grid;place-items:center}
#snd span{display:flex;gap:2px;align-items:center;height:12px}#snd span b{width:2px;height:3px;border-radius:2px;background:var(--ink)}
#snd.on span b{animation:eq 1s ease-in-out infinite alternate}#snd.on span b:nth-child(2){animation-delay:.25s}#snd.on span b:nth-child(3){animation-delay:.5s}
@keyframes eq{to{height:12px}}
header .btn{height:38px;padding:0 16px;font-size:13.5px}
/* her speech bubble */
#bub{position:fixed;left:0;top:0;z-index:25;pointer-events:none;padding:9px 14px;border-radius:16px 16px 16px 4px;background:rgba(243,238,232,.95);color:#0b0a0f;font-size:14px;font-weight:500;white-space:nowrap;opacity:0;transform:translate(-10%,-100%) scale(.8);transform-origin:0 100%;transition:opacity .3s,transform .4s var(--ease);box-shadow:0 10px 30px -10px rgba(255,120,60,.5)}
#bub.on{opacity:1;transform:translate(-10%,-100%) scale(1)}
#bub.mid{border-radius:16px;transform-origin:50% 100%;transform:translate(-50%,-100%) scale(.8);white-space:normal;max-width:80vw;text-align:center}#bub.mid.on{transform:translate(-50%,-100%) scale(1)}
#bub.flip{border-radius:16px 16px 4px 16px;transform-origin:100% 100%;transform:translate(-90%,-100%) scale(.8)}#bub.flip.on{transform:translate(-90%,-100%) scale(1)}
/* ---------- story chapters ---------- */
main{position:relative;z-index:1}
section.ch{position:relative}
.stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;pointer-events:none}
.stick a,.stick button,.stick .hit{pointer-events:auto}
[data-in]{opacity:0}
#hero{height:220vh}#noise{height:340vh}#signal{height:300vh}
.hero-t{position:absolute;left:var(--g);bottom:12vh;max-width:min(880px,58vw)}
.hero-t .kick{margin-bottom:28px}
h1{font-weight:300;font-size:clamp(48px,7vw,128px);line-height:.92;letter-spacing:-.058em}
h1 i{letter-spacing:-.04em;color:#fff}
.sub{margin-top:28px;max-width:500px;font-size:clamp(16px,1.2vw,19px);line-height:1.55;color:var(--ink2)}
.cta{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.trust{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap;font-size:13.5px;font-weight:500;color:var(--ink3)}
.trust span{display:flex;align-items:center;gap:8px}.trust span::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.foot{position:absolute;left:var(--g);bottom:4vh;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink3)}
.foot i{display:block;width:1px;height:30px;background:linear-gradient(var(--ink),transparent);animation:sc 2s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.n-t{position:absolute;left:var(--g);top:14vh;max-width:min(1000px,82vw)}
.n-t .kick{margin-bottom:22px}
h2.hx{font-weight:300;font-size:clamp(36px,4.4vw,80px);line-height:.98;letter-spacing:-.05em}
.n-t p{margin-top:20px;max-width:560px;color:var(--ink2);font-size:clamp(16px,1.15vw,18px)}
.alg{position:absolute;left:0;top:0;text-align:center;width:230px;pointer-events:auto;padding:10px 12px;border-radius:16px;transition:background .4s,opacity .3s}
.alg b{display:block;font-family:var(--head);font-weight:500;font-size:clamp(16px,1.3vw,21px);letter-spacing:-.02em}
.alg small{display:block;margin-top:4px;font-size:13.5px;line-height:1.4;color:var(--ink2)}
.alg.on{background:rgba(255,255,255,.06)}.alg.on b{color:var(--peach)}
.n-e{position:absolute;left:var(--g);right:var(--g);bottom:8vh;text-align:center}
.n-e p{font-family:var(--head);font-weight:300;font-size:clamp(22px,2.4vw,40px);letter-spacing:-.035em;line-height:1.15;color:var(--ink2)}
.n-e p b{color:var(--ink);font-weight:500}
.s-t{position:absolute;left:var(--g);top:13vh;max-width:820px}
.s-t .kick{margin-bottom:22px}
.s-t h2{font-weight:300;font-size:clamp(42px,5vw,92px);line-height:.94;letter-spacing:-.058em}
.s-t p{margin-top:22px;max-width:440px;color:var(--ink2);font-size:clamp(16px,1.15vw,18px)}
.fcard{position:absolute;right:calc(var(--g) + 10px);bottom:9vh;width:min(420px,40vw);padding:26px 28px 22px}
.fcard .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink3);font-weight:500}
.fcard .top span:first-child{display:flex;align-items:center;gap:8px}.fcard .top span:first-child::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.fbody{display:grid;margin-top:16px}
.fitem{grid-area:1/1;transition:opacity .6s var(--ease),transform .7s var(--ease);opacity:0;transform:translateY(14px)}
.fitem.on{opacity:1;transform:none}
.fitem .fk{font-size:13px;color:var(--ink3);font-weight:500}
.fitem .fv{font-family:var(--head);font-weight:200;font-size:clamp(60px,5.6vw,96px);letter-spacing:-.06em;line-height:1;margin:8px 0 10px;color:#fff}
.fitem h3{font-weight:500;font-size:19px;letter-spacing:-.02em}
.fitem p{margin-top:4px;color:var(--ink2);font-size:15px}
.fitem .mv{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;font-weight:500;display:flex;gap:10px}
.fitem .mv::before{content:'→';color:var(--ember)}
.fdots{display:flex;gap:6px;margin-top:18px}
.fdots button{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);position:relative;overflow:hidden;pointer-events:auto}
.fdots button i{position:absolute;inset:0;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.fdots button.done i{transform:scaleX(1)}
.fill{font-size:11.5px;color:var(--ink3);margin-top:12px}
/* ---------- content sections ---------- */
.sec{position:relative;padding:18vh var(--g) 12vh}
.wrap{max-width:1240px;margin:0 auto}
.sec h2.big{font-weight:300;font-size:clamp(40px,5.4vw,96px);line-height:.95;letter-spacing:-.055em;margin-top:22px;max-width:16ch}
.sec .lead{margin-top:22px;max-width:560px;color:var(--ink2);font-size:clamp(16px,1.2vw,19px)}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1.2s var(--ease)}
.rv.in{opacity:1;transform:none}
/* try her */
#talk{min-height:100vh}
.talk{display:grid;grid-template-columns:1fr minmax(0,600px);gap:40px}.talk>*,.free>*,.seven>*,.eng>*{min-width:0}
#brief .chips{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.talk .side{position:sticky;top:12vh;height:76vh;height:76svh}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.chips button{font-size:14px;font-weight:500;padding:10px 16px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);background:rgba(10,9,12,.35);backdrop-filter:blur(10px);transition:all .3s}
.chips button:hover{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.chips button.on{background:var(--ink);color:#0b0a0f;box-shadow:none}
.chat{margin-top:18px;padding:26px;min-height:380px}
.q{display:flex;justify-content:flex-end}
.q span{max-width:85%;background:var(--ember);color:#fff;padding:12px 16px;border-radius:18px 18px 4px 18px;font-weight:500;font-size:15.5px;box-shadow:0 10px 30px -10px rgba(255,90,31,.6)}
.who{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink3);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.reading{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:14px;margin-top:10px}
.reading .bar{flex:1;max-width:180px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.reading .bar i{display:block;height:100%;background:var(--peach);width:0;transition:width 1.3s linear}
.sig{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--dusk);box-shadow:inset 0 0 0 1px var(--line);margin-top:4px}
.sig::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.ans{margin-top:12px;font-size:17px;line-height:1.5;color:var(--ink)}
.move{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(255,90,31,.1);box-shadow:inset 0 0 0 1px rgba(255,90,31,.35);font-weight:500;display:flex;gap:10px}
.move::before{content:'→';color:var(--ember)}
.prep{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.prep div{padding:10px 14px;border-radius:14px;background:var(--dusk);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--ink3)}
.prep div b{display:block;font-family:var(--head);font-weight:400;font-size:26px;color:var(--ink);letter-spacing:-.03em;line-height:1.1}
.wkbtn{margin-top:16px;font-size:14px;font-weight:500;color:var(--peach);display:inline-flex;gap:8px}
.week{margin-top:14px;display:none}
.week.on{display:block}
.days{display:flex;gap:6px}
.days button{flex:1;padding:9px 0;border-radius:12px;font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink3)}
.days button.on{background:var(--ink);color:#0b0a0f}
.day{margin-top:12px;font-size:15.5px;color:var(--ink2);min-height:72px}
.hint{margin-top:16px;font-size:13.5px;color:var(--ink3)}
.ill{font-size:11.5px;color:var(--ink3);margin-top:10px}
/* why */
.cmpw{margin-top:48px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.cmp{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:15px}
.cmp th,.cmp td{text-align:left;padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-family:var(--head);font-weight:500;font-size:14px;color:var(--ink3)}
.cmp td:first-child{color:var(--ink);font-weight:500;width:24%}
.cmp td{color:var(--ink3)}
.cmp .u{color:var(--ink);background:rgba(255,90,31,.08);font-weight:500}
.cmp th.u{color:var(--peach);border-radius:16px 16px 0 0}
.seven{margin-top:80px;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.seven h3{font-weight:300;font-size:clamp(30px,3vw,52px);letter-spacing:-.045em;line-height:1}
.seven p{margin-top:16px;color:var(--ink2);max-width:480px}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.roles span{padding:10px 14px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink3);transition:all .9s var(--ease)}
.roles.go span{opacity:.18;transform:scale(.92);text-decoration:line-through}
.roles .one{background:var(--ink);color:#0b0a0f;font-weight:600;box-shadow:0 0 40px -6px rgba(255,170,130,.5);opacity:0;transform:scale(.6)}
.roles.go .one{opacity:1;transform:none;text-decoration:none}
.stat{display:flex;gap:40px;margin-top:28px}
.stat div b{display:block;font-family:var(--head);font-weight:200;font-size:clamp(48px,5vw,84px);letter-spacing:-.06em;line-height:1}
.stat div span{font-size:14px;color:var(--ink3)}
.stat div:last-child b{color:var(--peach)}
.sick{margin-top:40px;font-family:var(--head);font-weight:300;font-size:clamp(20px,2vw,30px);letter-spacing:-.03em;max-width:880px;color:var(--ink2)}
/* month */
.tog{display:inline-flex;padding:4px;margin-top:30px}
.tog button{padding:10px 22px;border-radius:99px;font-weight:600;font-size:14px;color:var(--ink3);transition:all .3s}
.tog button.on{background:var(--ink);color:#0b0a0f}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.area{padding:24px}
.area h3{font-weight:500;font-size:19px;letter-spacing:-.02em}
.area p{font-size:14px;color:var(--ink3);margin-top:8px;min-height:64px}
.nums{margin-top:16px;display:grid;gap:10px}
.nums div{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--ink2)}
.nums div b{font-family:var(--head);font-weight:300;font-size:30px;color:var(--ink);letter-spacing:-.04em}
.proonly{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center;font-size:14px}
.proonly span{padding:8px 14px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(255,90,31,.4);transition:opacity .4s}
.proonly.dim span{opacity:.3}
/* plans */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:48px}
.plan{padding:30px;display:flex;flex-direction:column;position:relative}
.plan.hot{background:linear-gradient(160deg,rgba(255,140,90,.22),rgba(255,90,31,.05) 60%);box-shadow:inset 0 0 0 1px rgba(255,140,90,.55),0 40px 90px -30px rgba(255,90,31,.35)}
.plan .badge{position:absolute;top:22px;right:22px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--ember);color:#fff}
.plan h3{font-weight:400;font-size:26px;letter-spacing:-.035em}
.plan p{margin-top:8px;color:var(--ink2);font-size:15px;min-height:48px}
.plan ul{list-style:none;margin:22px 0 26px;display:grid;gap:10px;font-size:15px}
.plan li{display:flex;gap:10px}.plan li::before{content:'';flex:none;width:6px;height:6px;border-radius:50%;margin-top:9px;background:var(--peach)}
.plan .btn{margin-top:auto;justify-content:center}
.pnote{margin-top:20px;font-size:13px;color:var(--ink3);max-width:760px}
/* control */
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:48px}
.ctrl div{padding:26px}
.ctrl h3{font-weight:500;font-size:20px;display:flex;align-items:center;gap:10px}
.ctrl h3::before{content:'';width:10px;height:10px;border-radius:50%}
.ctrl div:nth-child(1) h3::before{background:var(--lime);box-shadow:0 0 10px var(--lime)}
.ctrl div:nth-child(2) h3::before{background:var(--peach);box-shadow:0 0 10px var(--peach)}
.ctrl div:nth-child(3) h3::before{background:var(--ember);box-shadow:0 0 10px var(--ember)}
.ctrl p{margin-top:10px;color:var(--ink2);font-size:15px}
.guar{margin-top:14px;padding:28px;display:grid;grid-template-columns:1fr 2fr;gap:30px}
.guar h3{font-weight:400;font-size:22px;letter-spacing:-.02em}
.guar ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:14px 30px;font-size:15px;color:var(--ink2)}
.guar li{display:flex;gap:10px}.guar li::before{content:'✓';color:var(--peach)}
.eng{margin-top:100px;display:grid;grid-template-columns:1.2fr 1fr;gap:50px;align-items:end}
.eng h3{font-weight:300;font-size:clamp(30px,3.4vw,60px);letter-spacing:-.05em;line-height:1}
.eng p{color:var(--ink2)}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.facts span{padding:10px 16px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500}
.partners{margin-top:60px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0;overflow:hidden;position:relative}
.partners .lab{font-size:12.5px;color:var(--ink3);font-weight:500;margin-bottom:16px}
.track{display:flex;gap:80px;width:max-content;animation:mq 26s linear infinite}
.track span{font-family:var(--head);font-weight:500;font-size:clamp(26px,2.6vw,40px);letter-spacing:-.03em;color:var(--ink2);white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
/* free + brief */
.free{display:grid;grid-template-columns:1fr minmax(0,520px);gap:60px;align-items:start}
.deliv{list-style:none;margin-top:28px;display:grid;gap:12px;counter-reset:d}
.deliv li{display:flex;gap:16px;align-items:center;font-size:17px;padding:16px 18px;border-radius:16px;background:var(--dusk);box-shadow:inset 0 0 0 1px var(--line)}
.deliv li::before{counter-increment:d;content:counter(d);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#0b0a0f;font-weight:600;font-size:14px}
.then{margin-top:20px;color:var(--ink2)}
.lim{margin-top:14px;font-size:14px;color:var(--peach);display:flex;gap:8px;align-items:center}.lim::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ember);animation:pulse 1.6s infinite}
.brief{padding:30px}
.brief .st{font-size:12.5px;color:var(--ink3);font-weight:600;display:flex;justify-content:space-between}
.brief .prog{height:2px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:12px;overflow:hidden}.brief .prog i{display:block;height:100%;background:var(--peach);transition:width .5s var(--ease)}
.brief h3{font-weight:400;font-size:24px;letter-spacing:-.03em;margin:22px 0 16px}
.step{display:none}.step.on{display:block;animation:fi .5s var(--ease)}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.brief .chips{margin-top:0}
.field{display:block;margin-bottom:10px}
.field input{width:100%;height:52px;padding:0 16px;border-radius:14px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px var(--line);font-size:16px;outline:none;transition:box-shadow .3s}
.field input:focus{box-shadow:inset 0 0 0 1px var(--peach)}
.field input::placeholder{color:var(--ink3)}
.bnav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
.bnav .back{font-size:14px;color:var(--ink3);font-weight:500}
.safe{margin-top:14px;font-size:13px;color:var(--ink3)}
.done{display:none}.done.on{display:block;animation:fi .5s var(--ease)}
.done .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.done p{color:var(--ink2);margin-top:8px}
/* faq */
.faq{margin-top:40px;border-top:1px solid var(--line);max-width:900px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:22px 40px 22px 0;font-family:var(--head);font-weight:400;font-size:clamp(18px,1.6vw,24px);letter-spacing:-.02em;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:300;color:var(--peach);transition:transform .4s var(--ease)}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq p{padding:0 40px 24px 0;color:var(--ink2);max-width:720px}
/* game */
#game{min-height:100vh;min-height:100svh;position:relative;display:flex}
.g-in{position:relative;flex:1;padding-top:10vh!important;padding-bottom:12vh!important;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--g);transition:opacity .6s}
.g-her{width:100%;height:min(36vh,340px);flex:none}
.g-in h2{font-weight:300;font-size:clamp(40px,5.4vw,96px);line-height:.95;letter-spacing:-.055em;margin-top:20px}
.g-in p{margin-top:18px;max-width:520px;color:var(--ink2)}
.g-in .btn{margin-top:30px}
.g-in small{display:block;margin-top:16px;font-size:13px;color:var(--ink3)}
html.gaming .g-in{opacity:0;pointer-events:none}
#hud{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}
html.gaming #hud{display:block}
.tasks{position:absolute;left:var(--g);top:24px;padding:16px 18px;display:grid;gap:8px;font-size:14px;min-width:240px}
.tasks div{display:flex;justify-content:space-between;gap:20px;color:var(--ink2)}
.tasks div.ok{color:var(--lime)}
.tasks div b{font-weight:600;font-variant-numeric:tabular-nums}
.hudr{position:absolute;right:var(--g);top:24px;display:flex;gap:8px;pointer-events:auto}
.toast{position:absolute;left:50%;top:18vh;transform:translate(-50%,10px);padding:12px 18px;font-size:15px;font-weight:500;opacity:0;transition:all .5s var(--ease);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:var(--g);background:rgba(3,3,4,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ov.on{display:flex;animation:fi .4s var(--ease)}
.ov .glass{max-width:520px;width:100%;padding:36px;text-align:center}
.ov h3{font-weight:300;font-size:clamp(30px,3vw,46px);letter-spacing:-.045em;line-height:1}
.ov p{margin-top:14px;color:var(--ink2)}
.ov .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.code{margin-top:22px;font-family:var(--head);font-size:30px;font-weight:500;letter-spacing:.08em;padding:14px;border-radius:14px;background:var(--dusk);box-shadow:inset 0 0 0 1px rgba(255,140,90,.5);color:var(--peach)}
.rare{margin-top:12px;font-size:12.5px;color:var(--ink3)}
/* footer */
footer{position:relative;z-index:1;padding:14vh var(--g) 40px;border-top:1px solid var(--line);background:linear-gradient(transparent,rgba(3,3,4,.8))}
.fwm{height:clamp(60px,14vw,220px)}.fwm svg{height:100%;width:auto;display:block}
.fgrid{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;margin-top:40px;font-size:15px;color:var(--ink2)}
.fgrid a:hover{color:var(--ink)}
.fgrid div{display:grid;gap:8px}
.fgrid small{color:var(--ink3);font-size:13px}
/* cursor: her two eyes */
#cur{position:fixed;left:0;top:0;z-index:150;pointer-events:none;opacity:0;transition:opacity .3s;mix-blend-mode:difference}
#cur div{position:absolute;left:0;top:0;display:flex;gap:5px;transform:translate(-50%,-50%);transition:transform .35s var(--ease),opacity .3s}
#cur b{display:block;width:8px;height:15px;border-radius:8px;background:#fff;transition:transform .12s}
#cur.blink b{transform:scaleY(.1)}#cur.big div{transform:translate(-50%,-50%) scale(1.6)}
#cur.hot div{opacity:0}
#cur::after{content:'';position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #fff;opacity:0;transform:scale(.5);transition:all .3s var(--ease)}
#cur.hot::after{opacity:1;transform:none}
@media (hover:hover) and (pointer:fine){.cur-on,.cur-on *{cursor:none!important}}
@media (max-width:1000px){
 .areas{grid-template-columns:1fr 1fr}.plans,.ctrl{grid-template-columns:1fr}.seven,.eng,.free,.guar{grid-template-columns:1fr}.guar ul{grid-template-columns:1fr}
}
.cmpm{display:none}
.cm{padding:18px 20px;border-radius:20px}.cm h4{font-family:var(--head);font-weight:500;font-size:17px;letter-spacing:-.02em}
.cu{margin-top:10px;display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:12px;background:rgba(255,90,31,.1);box-shadow:inset 0 0 0 1px rgba(255,90,31,.35)}
.cu span{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--peach)}.cu b{font-weight:500;font-size:15px}
.co{margin-top:10px;display:grid;gap:4px;font-size:13.5px;color:var(--ink3)}.co div{display:flex;justify-content:space-between;gap:12px}.co span{color:var(--ink2)}
@media (max-width:820px){
 .cmpw{display:none}.cmpm{display:grid;gap:10px;margin-top:30px}
 #hero{height:150vh}#noise{height:230vh}#signal{height:210vh}
 .alg{width:46vw;max-width:170px}
 nav.mid,.right .btn{display:none}
 .hero-t{max-width:none;right:var(--g);bottom:7vh}
 h1{font-size:clamp(42px,12vw,64px)}
 .sub{margin-top:18px}.cta{margin-top:22px}.trust{gap:12px;margin-top:18px;font-size:12.5px}
 .foot{display:none}
 .n-t{top:11vh;right:var(--g);max-width:none}
 h2.hx{font-size:clamp(30px,8.6vw,44px)}
 .n-t p{display:none}
 .alg{width:140px;padding:6px}.alg b{font-size:15px}.alg small{font-size:11.5px}
 .n-e{bottom:5vh}
 .s-t{top:11vh;right:var(--g)}
 .s-t h2{font-size:clamp(40px,11vw,62px)}
 .s-t p{display:none}
 .fcard{left:var(--g);right:var(--g);width:auto;bottom:4vh;padding:20px 22px 18px}
 .fitem .fv{font-size:52px}
 .talk{grid-template-columns:1fr}.talk .side{position:relative;top:0;height:40vh}
 .chips{flex-wrap:nowrap;overflow-x:auto;margin-left:calc(-1*var(--g));margin-right:calc(-1*var(--g));padding:0 var(--g) 4px;scrollbar-width:none}
 .chips::-webkit-scrollbar{display:none}
 .chips button{flex:none}
 .chat{padding:20px}
 .areas{grid-template-columns:1fr}
 .sec{padding:14vh var(--g) 8vh}
 .stat{gap:24px}
 .tasks{top:auto;bottom:20px;min-width:0;font-size:12.5px;padding:12px 14px}
}
</style>
</head>
